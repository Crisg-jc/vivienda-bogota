name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Revisión de estilo y errores probables
        run: ruff check .
      - name: Pruebas
        run: pytest -q

  navegadores:
    # La interfaz debe funcionar en Chrome, Edge, Firefox, Safari, Opera y Samsung Internet (.browserslistrc).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save es-check@7.2.1 eslint@8.57.1 eslint-plugin-compat@4.2.0 doiuse@6.0.5 postcss@8.4.49
      - name: Sintaxis de JavaScript (ES2020)
        run: npx es-check es2020 app/static/app.js --module && npx es-check es5 app/static/navegador-antiguo.js app/static/registro.js
      - name: APIs de JavaScript
        run: npx eslint --no-eslintrc -c herramientas/compatibilidad.eslintrc.json app/static/app.js app/static/registro.js
      - name: Propiedades CSS
        run: node herramientas/compatibilidad_css.js

  imagen:
    # La imagen de Docker debe construirse y arrancar sana en cada cambio.
    runs-on: ubuntu-latest
    needs: pruebas
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vivienda-bogota .
      - name: Arranque y chequeo de salud
        run: |
          docker run -d --name app -p 8000:8000 vivienda-bogota
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/salud && exit 0; sleep 3; done
          docker logs app; exit 1
